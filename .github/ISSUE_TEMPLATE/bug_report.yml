name: Bug report
description: Report incorrect behavior with a reproducible example.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link a minimal repository or provide steps and a small code example. Include the routes, the adapters and the command involved, and whether the Beacon was started.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Include the Beacon packages, the provider SDK and its version, framework, browser, Node, Expo or React Native version, and the device and operating system.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: State and diagnostics
      description: Include the route's state and the `beacon.diagnostics` snapshot or events around the problem. Remove tokens, account identifiers and URLs with credentials from anything you paste.
