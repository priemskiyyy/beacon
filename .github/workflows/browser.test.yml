name: browser-test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**"
      - "examples/**"
      - ".github/actions/setup/**"
      - ".github/workflows/browser.test.yml"
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**"
      - "examples/**"
      - ".github/actions/setup/**"
      - ".github/workflows/browser.test.yml"

permissions:
  contents: read

concurrency:
  group: browser-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The release labs, the web export of the Expo lab and the minimal React app run in a real browser against the built packages.
      - name: Examples in Chromium
        run: pnpm test:browser

      # Metro resolves the packages' exports for both native platforms; a device still has to run them.
      - name: Expo native bundles
        run: |
          pnpm --filter example-expo build:native
          pnpm --filter example-expo-lab build:native

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: example-results
          path: .artifacts/example-results
          # The folder is under a dot directory, which v4.4 and later leave out unless told.
          include-hidden-files: true
          retention-days: 7
