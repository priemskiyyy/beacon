name: packages-test

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

# Named, not derived from the workflow: when a caller runs this workflow, every
# called workflow shares the caller's name and they would cancel each other.
concurrency:
  group: packages-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: packages-test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Node and the newest.
        node: ["22.18.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      # The adapters and the React binding import the core by its package name.
      - name: Build packages
        run: pnpm build

      - name: Linting Typescript
        run: pnpm lint:typescript

      - name: Linting Eslint
        run: pnpm lint:eslint

      # Each probe proves one lint rule still rejects what it was written for.
      - name: Lint rule probes
        run: pnpm test:lint

      # Every test names the specification row it proves, and the table in the
      # verification doc is read from them.
      - name: Scenario coverage
        run: pnpm test:scenarios

      # The limits a document must state, so none is claimed away.
      - name: Documented limits
        run: pnpm test:limits

      # A built package imports only what its role allows.
      - name: Package imports
        run: pnpm test:package

      # Each built entry stays within its gzip budget.
      - name: Bundle size
        run: pnpm test:size

      # Every provider SDK and the clock are faked in process, so the whole
      # suite runs here with no device, no network and no credentials.
      - name: Unit tests
        run: pnpm test:unit

      # Each mutant weakens one rule; a mutant the tests do not kill is a missing test or dead code.
      - name: Mutation checks
        run: pnpm test:mutation

  # The binding claims React 18.3 and up, and the suite runs on the 19.2 that React Native 0.86 and Expo SDK 57 ship, so the oldest it claims is run on its own. Devtools need 19.2 and the native renderer tests are written for it, so only the web binding's tests run here.
  react-floor:
    name: packages-test (react 18.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          node-version: "22.18.0"

      - name: Install the oldest React the binding claims
        run: pnpm add -Dw --ignore-scripts react@18.3.1 react-dom@18.3.1

      # The binding imports the core by its package name.
      - name: Build packages
        run: pnpm build

      - name: React binding on React 18.3
        run: pnpm exec vitest run --project react
