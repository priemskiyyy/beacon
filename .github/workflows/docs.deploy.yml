name: docs-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "docs/**"
      - "scripts/verify-links.mjs"
      - ".github/actions/setup/**"
      - ".github/workflows/docs.deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The site is served from https://priemskiyyy.github.io/beacon/, so it is built
    # for that base path whether or not Pages is switched on yet: the build and the
    # check of its links run on every push, and only the deployment below needs Pages.
    env:
      DOCS_SITE_URL: https://priemskiyyy.github.io/beacon/
      DOCS_BASE_PATH: /beacon/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build site
        run: pnpm build:docs

      # Under the base path the deployment serves it from, which a build for `/` cannot prove.
      - name: Check the built site
        run: pnpm verify:links

      - name: Upload artifact
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    # Pages is not available to a private repository on the current plan, and a
    # public one has to select GitHub Actions as its Pages source first: see
    # .github/REPOSITORY_SETUP.md.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
